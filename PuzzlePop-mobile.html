<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PuzzlePop"><title>PuzzlePop</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111827;color:#fff;min-height:100vh}main{max-width:520px;margin:auto;padding:28px 16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:30px;font-weight:900}.tag{background:#374151;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.levels{display:flex;gap:8px;margin-bottom:16px}.levels button,.actions button{flex:1;min-height:46px;border:1px solid #4b5563;border-radius:14px;background:#1f2937;color:#fff;font-weight:800;font-size:15px}.levels button.active,.actions .primary{background:#6366f1;border-color:#6366f1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.stat{text-align:center;background:#1f2937;border:1px solid #374151;border-radius:14px;padding:10px}.stat b{display:block;font-size:20px}.stat small{font-size:10px;color:#9ca3af}#board{display:grid;gap:8px;width:min(92vw,390px);aspect-ratio:1;margin:auto auto 16px}.tile{border:0;border-radius:16px;background:#1f2937;color:#fff;box-shadow:inset 0 0 0 1px #4b5563;font-size:clamp(24px,8vw,42px);font-weight:900;touch-action:manipulation}.tile:active{transform:scale(.94)}.empty{background:transparent;box-shadow:none}.msg{text-align:center;min-height:30px;font-weight:800}.actions{display:flex;gap:9px}.actions button{padding:10px}.actions .primary{color:white}</style></head><body><main><div class="head"><div class="logo">🧩 PuzzlePop</div><div class="tag" id="label">3×3</div></div><div class="levels"><button data-size="3" class="active">3×3</button><button data-size="4">4×4</button><button data-size="5">5×5</button></div><div class="stats"><div class="stat"><b id="moves">0</b><small>MOVIMIENTOS</small></div><div class="stat"><b id="time">00:00</b><small>TIEMPO</small></div><div class="stat"><b id="best">—</b><small>MEJOR</small></div></div><div id="board"></div><div id="msg" class="msg"></div><div class="actions"><button id="mix" class="primary">🔀 Mezclar</button><button id="restart">↩ Reiniciar</button></div></main><script>(()=>{let size=3,state=[],moves=0,secs=0,timer=null,best={};const $=id=>document.getElementById(id);function goal(){return Array.from({length:size*size-1},(_,i)=>i+1).concat(0)}function fmt(x){return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function draw(){const b=$('board');b.style.gridTemplateColumns=`repeat(${size},1fr)`;b.innerHTML='';state.forEach((v,i)=>{let q=document.createElement('button');q.className='tile'+(!v?' empty':'');q.textContent=v||'';if(v)q.onclick=()=>move(i);b.appendChild(q)});$('moves').textContent=moves;$('time').textContent=fmt(secs);$('best').textContent=best[size]===undefined?'—':fmt(best[size]);$('label').textContent=size+'×'+size}function start(){if(!timer)timer=setInterval(()=>{$('time').textContent=fmt(++secs)},1000)}function move(i){let z=state.indexOf(0),r=Math.floor(i/size),c=i%size,zr=Math.floor(z/size),zc=z%size;if(Math.abs(r-zr)+Math.abs(c-zc)!==1)return;start();[state[i],state[z]]=[state[z],state[i]];moves++;draw();if(state.every((v,j)=>v===goal()[j]))win()}function win(){clearInterval(timer);timer=null;if(best[size]===undefined||secs<best[size])best[size]=secs;$('msg').textContent='🎉 ¡Nivel completado!';draw()}function shuffle(){clearInterval(timer);timer=null;state=goal();let prev=-1;for(let n=0;n<size*size*25;n++){let z=state.indexOf(0),zr=Math.floor(z/size),zc=z%size,opts=[];for(let i=0;i<state.length;i++){let r=Math.floor(i/size),c=i%size;if(Math.abs(r-zr)+Math.abs(c-zc)===1&&i!==prev)opts.push(i)}let p=opts[Math.floor(Math.random()*opts.length)];prev=z;[state[p],state[z]]=[state[z],state[p]]}moves=0;secs=0;$('msg').textContent='';draw()}function restart(){clearInterval(timer);timer=null;state=goal();moves=0;secs=0;$('msg').textContent='';draw()}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=+b.dataset.size;document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));b.classList.add('active');shuffle()});$('mix').onclick=shuffle;$('restart').onclick=restart;shuffle()})();</script></body></html>
